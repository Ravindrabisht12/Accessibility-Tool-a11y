services:
  mongodb:
    image: mongo:7
    container_name: a11y-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: a11ypass
      MONGO_INITDB_DATABASE: a11y-monitor
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
