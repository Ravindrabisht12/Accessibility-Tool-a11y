kind = "web"
previewPath = "/"
title = "Accessibility Tester"
version = "1.0.0"
id = "artifacts/a11y-tester"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20372

[services.development]
run = "pnpm --filter @workspace/a11y-tester run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/a11y-tester", "run", "build" ]
publicDir = "artifacts/a11y-tester/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20372"
BASE_PATH = "/"
