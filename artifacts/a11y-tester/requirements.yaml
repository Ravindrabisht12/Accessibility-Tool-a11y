packages:
  "framer-motion": "For smooth page transitions, expandable cards, and scanning animations"
  "recharts": "To display beautiful data visualizations of accessibility results"
  "@hookform/resolvers": "For Zod form validation"
  "react-hook-form": "For robust form state management"
  "zod": "For strongly typed form schemas"
  "date-fns": "For formatting scan timestamps"

images:
  - path: "artifacts/a11y-tester/public/images/logo.png"
    description: "A minimal, modern geometric logo of a stylized eye or shield representing accessibility and scanning. Clean lines, neon blue and purple gradient on a transparent or very dark background. Highly polished, tech startup vibe."
    aspect_ratio: "1:1"
  - path: "artifacts/a11y-tester/public/images/hero-bg.png"
    description: "An abstract, dark, futuristic background featuring subtle glowing grid lines, code snippets fading into darkness, and soft neon blue and cyan light leaks. Represents deep technical analysis and scanning."
    aspect_ratio: "16:9"

notes:
  - "The app strictly uses dark mode for a premium developer tool aesthetic."
  - "Using the generated `useRunAccessibilityScan` hook from `@workspace/api-client-react` for API communication."
